<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 80" width="380" height="80">
  <defs>
    <linearGradient id="gradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Icon Circle -->
  <g transform="translate(10, 6)">
    <circle cx="34" cy="34" r="32" fill="url(#gradPrimary)" filter="url(#shadow)"/>
    <circle cx="34" cy="34" r="30" fill="none" stroke="#f59e0b" stroke-width="2"/>
    
    <!-- Open Book -->
    <!-- Left page -->
    <path d="M 34,22 C 30,21 22,23 16,27 L 16,48 C 22,44 30,42 34,43 Z" fill="#ffffff" opacity="0.95"/>
    <!-- Right page -->
    <path d="M 34,22 C 38,21 46,23 52,27 L 52,48 C 46,44 38,42 34,43 Z" fill="url(#gradGold)"/>
    <!-- Spine -->
    <path d="M 34,21 L 34,44" stroke="#1e3a8a" stroke-width="2" stroke-linecap="round"/>
    <!-- Small bookmark ribbon -->
    <path d="M 34,43 L 34,50 L 37,47 L 40,50 L 40,43 Z" fill="#ef4444"/>
  </g>
  
  <!-- Text Brand -->
  <text x="88" y="38" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#0f172a" letter-spacing="0.5">
    UT <tspan fill="#2563eb">BOOK</tspan><tspan fill="#f59e0b">STORE</tspan>
  </text>
  <text x="90" y="58" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="1.2">
    TOKO BUKU DIGITAL &amp; AKADEMIK
  </text>
</svg>